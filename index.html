<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457c5">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>받아쓰기 노트</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1a1f2b; --sub:#5b6577; --line:#d9deea;
  --accent:#2457c5; --accent-text:#fff; --ok:#17803d; --bad:#c4281c; --warn-bg:#fff4d6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10131a; --card:#1a1f2b; --text:#eef1f7; --sub:#9aa5ba; --line:#2d3546;
    --accent:#6b94f0; --accent-text:#0b1020; --ok:#4fd083; --bad:#ff7a6e; --warn-bg:#3a3118;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:18px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--accent);color:var(--accent-text);padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));font-size:22px;font-weight:700}
nav{display:flex;gap:6px;max-width:720px;margin:12px auto 0;padding:0 12px}
nav button{flex:1;min-height:52px;border:2px solid var(--line);background:var(--card);color:var(--text);
  border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
main{max-width:720px;margin:0 auto;padding:12px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin:0 0 10px}
label{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;min-height:50px;padding:10px 12px;font:inherit;color:var(--text);background:var(--bg);
  border:2px solid var(--line);border-radius:10px}
textarea{min-height:90px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:10px 20px;
  font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);cursor:pointer}
.btn.big{width:100%;min-height:60px;font-size:20px}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>.btn{flex:1;min-width:130px}
.muted{color:var(--sub);font-size:16px}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--line);
  border-radius:12px;margin:8px 0;cursor:pointer;font-weight:400}
.mode input{width:24px;height:24px;margin-top:4px;flex:none}
.mode b{display:block}
.mode:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.check{display:flex;gap:10px;align-items:center;font-weight:400;margin-top:8px}
.check input{width:24px;height:24px}
.info{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.warn{background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.err{border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:700;white-space:pre-wrap}
.ok{color:var(--ok);font-weight:700}
.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:48px;border:2px solid var(--line);background:transparent;color:var(--text);
  border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:12px;
  min-height:140px;max-height:60vh;overflow:auto;user-select:text;-webkit-user-select:text}
.hist{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .t{flex:1;min-width:180px;word-break:break-all}
.hist .btn{min-height:46px;padding:6px 14px}
.chunkfail{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;
  padding:8px 12px;border:2px solid var(--bad);border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#222;color:#fff;padding:12px 20px;border-radius:24px;font-size:17px;opacity:0;
  pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
input[type=file]{display:none}
</style>
</head>
<body>
<header>🎙️ 받아쓰기 노트</header>
<nav role="tablist">
  <button role="tab" data-view="home" aria-selected="true">받아쓰기</button>
  <button role="tab" data-view="hist" aria-selected="false">기록</button>
  <button role="tab" data-view="set" aria-selected="false">설정</button>
</nav>

<main>
<!-- ===== 받아쓰기 화면 ===== -->
<section id="v-home">
  <div class="card" id="nokey" hidden>
    <b>먼저 OpenAI API 키가 필요해요.</b>
    <div class="row"><button class="btn" data-goto="set">설정으로 가기</button></div>
  </div>

  <div class="card" id="c-file">
    <h2>1. 녹음 파일 고르기</h2>
    <label for="file" class="btn big" style="margin:0">📁 파일 선택 (m4a · mp3 · wav · webm · mp4)</label>
    <input id="file" type="file" accept="audio/*,video/mp4,video/webm,.m4a,.mp3,.wav,.webm,.mp4">
    <div id="fileinfo" class="info" hidden></div>
  </div>

  <div class="card" id="c-mode">
    <h2>2. 무엇을 할까요?</h2>
    <label class="mode"><input type="radio" name="mode" value="raw" checked>
      <span><b>받아쓰기만</b><span class="muted">녹음을 글로만 바꿉니다.</span></span></label>
    <label class="mode"><input type="radio" name="mode" value="lecture">
      <span><b>강의 정리</b><span class="muted">요약 · 핵심 3가지 · 개념 · 강조점 · 해볼 것</span></span></label>
    <label class="mode"><input type="radio" name="mode" value="one21">
      <span><b>121 정리</b><span class="muted">BNI 원투원 기록 (상대 사업 · 이상적 고객 · 다음 할 일)</span></span></label>
    <label class="check" id="polishRow"><input type="checkbox" id="polish">
      문단 나누기와 군말(어, 음) 정리 <span class="muted">(내용은 안 바꿈)</span></label>
    <div class="row"><button class="btn big" id="start" disabled>시작</button></div>
  </div>

  <div class="card" id="c-prog" hidden>
    <h2>진행 중</h2>
    <div id="status" style="font-weight:700">준비 중…</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="muted">화면을 켜 두고 이 탭을 닫지 마세요.</div>
    <div id="fails"></div>
    <div class="row"><button class="btn danger" id="cancel">중단</button></div>
  </div>

  <div id="proberr"></div>
  <div id="result"></div>
</section>

<!-- ===== 기록 ===== -->
<section id="v-hist" hidden>
  <div class="card">
    <h2>최근 기록 (최대 20개)</h2>
    <div id="histlist" class="muted">불러오는 중…</div>
  </div>
</section>

<!-- ===== 설정 ===== -->
<section id="v-set" hidden>
  <div class="card">
    <h2>OpenAI API 키</h2>
    <div id="keystate" class="muted"></div>
    <label for="keyin">새 키 입력</label>
    <input id="keyin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-…">
    <div class="row">
      <button class="btn" id="keysave">키 저장</button>
      <button class="btn danger" id="keydel">키 삭제</button>
    </div>
    <div class="muted" style="margin-top:8px">키는 이 기기의 브라우저에만 저장되고, OpenAI 외 어디로도 보내지 않아요.</div>
  </div>

  <div class="card">
    <h2>받아쓰기 설정</h2>
    <label for="vocab">자주 쓰는 단어 (쉼표로 구분)</label>
    <textarea id="vocab"></textarea>
    <div class="muted">고유명사 인식률을 높이는 데 쓰여요.</div>
    <label for="model">정리 모델 이름</label>
    <input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="tmodel">받아쓰기 모델 이름</label>
    <input id="tmodel" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="rate">환율 (1달러 = 몇 원, 비용 표시용)</label>
    <input id="rate" type="number" inputmode="numeric" min="500" max="3000" step="10">
    <div class="row"><button class="btn sec" id="test">연결 테스트</button></div>
    <div id="testout"></div>
  </div>

  <div class="card">
    <h2>데이터</h2>
    <div class="row"><button class="btn danger" id="clearhist">기록 전체 삭제</button></div>
  </div>
</section>
</main>
<div id="toast"></div>

<script>
'use strict';
/* ================= 상수 ================= */
const API = 'https://api.openai.com';
const FFMPEG_JS = 'https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
const FFMPEG_CORE = 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js';
const USD_PER_MIN = 0.0045;          // 받아쓰기 분당 단가
const DIRECT_MAX = 20 * 1024 * 1024; // 이 이하는 그대로 전송
const DIRECT_SEC = 1200;             // 단, 20분 넘는 긴 녹음은 용량이 작아도 나눠 보냄 (65분/15MB 파일이 400 오류로 거부됨을 실측)
const needSplit = (file, dur) => file.size > DIRECT_MAX || dur > DIRECT_SEC;
const CHUNK_TARGET = 16e6;           // 조각 목표 크기(바이트) — 18MB 이하 보장용 여유 포함
const CHUNK_MAX_SEC = 600;
const KEEP = 20;
const DEFAULTS = {
  vocab: 'BNI, 121, 원투원, 파이오니어, 자이언츠, 리퍼럴, 위클리, 챕터',
  model: 'gpt-6-luna', tmodel: 'gpt-transcribe', rate: '1400'
};
const MODE_LABEL = { raw: '받아쓰기', lecture: '강의 정리', one21: '121 정리' };

/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d = '') { try { const v = localStorage.getItem('tn_' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tn_' + k, v); } catch { toast('이 브라우저는 설정 저장을 막고 있어요'); } },
  del(k) { try { localStorage.removeItem('tn_' + k); } catch {} }
};
const cfg = {
  get key() { return store.get('key'); },
  get vocab() { return store.get('vocab', DEFAULTS.vocab); },
  get model() { return store.get('model', DEFAULTS.model).trim() || DEFAULTS.model; },
  get tmodel() { return store.get('tmodel', DEFAULTS.tmodel).trim() || DEFAULTS.tmodel; },
  get rate() { return Number(store.get('rate', DEFAULTS.rate)) || 1400; }
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${x}초` : `${x}초`; };
const fmtMB = b => (b / 1048576).toFixed(b >= 1e7 ? 0 : 1) + 'MB';
const fmtDate = t => { const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const maskKey = k => k ? 'sk-…' + k.slice(-4) : '';
const baseName = n => n.replace(/\.[^.]+$/, '') || '녹음';

/* ================= 에러 → 사람 말 ================= */
class AppError extends Error {
  constructor(msg, { status = 0, retry = false, fatal = false, aborted = false } = {}) {
    super(msg); this.status = status; this.retry = retry; this.fatal = fatal; this.aborted = aborted;
  }
}
function apiError(status, body) {
  const e = (body && body.error) || {};
  const code = e.code || e.type || '', raw = String(e.message || '');
  const low = (code + ' ' + raw).toLowerCase();
  if (status === 401) return new AppError('API 키가 맞지 않아요.\n→ 설정에서 키를 다시 넣어 주세요. (sk-로 시작, 복사할 때 빈칸이 끼지 않았는지 확인)', { status, fatal: true });
  if (status === 403) return new AppError('이 키로는 이 기능을 쓸 수 없어요 (권한 또는 지역 제한).\n→ platform.openai.com 에서 키 권한과 프로젝트의 모델 허용 목록을 확인하세요.', { status, fatal: true });
  if (status === 429 && low.includes('insufficient_quota'))
    return new AppError('OpenAI 잔액(크레딧)이 부족해요.\n→ platform.openai.com → Billing에서 충전한 뒤 다시 시작하세요.', { status, fatal: true });
  if (status === 429) return new AppError('요청이 너무 몰려 잠시 막혔어요. 자동으로 다시 시도합니다.', { status, retry: true });
  if (status === 413 || low.includes('maximum content size') || low.includes('too large'))
    return new AppError('파일이 너무 커서 OpenAI가 받지 않아요.\n→ 더 짧게 나누거나 다시 시도하세요.', { status });
  if (status === 404 || low.includes('model_not_found') || low.includes('does not exist'))
    return new AppError('모델 이름을 찾을 수 없어요: ' + raw.slice(0, 120) + '\n→ 설정에서 모델 이름을 확인하고 [연결 테스트]를 눌러 보세요.', { status, fatal: true });
  if (low.includes('context_length') || low.includes('maximum context'))
    return new AppError('내용이 너무 길어 한 번에 정리할 수 없어요.', { status });
  if (status === 400 && (low.includes('format') || low.includes('could not be decoded') || low.includes('corrupt')))
    return new AppError('이 파일 형식을 읽을 수 없거나 파일이 손상됐어요.\n→ m4a / mp3 / wav / webm / mp4 파일인지 확인하세요.', { status });
  if (status >= 500) return new AppError('OpenAI 서버가 잠시 불안정해요. (' + status + ')', { status, retry: true });
  return new AppError('요청이 실패했어요 (' + status + '): ' + raw.slice(0, 200), { status });
}

/* ================= API 호출 ================= */
async function request(path, init, { signal, timeout = 300000 } = {}) {
  const key = cfg.key;
  if (!key) throw new AppError('API 키가 없어요.\n→ 설정에서 키를 넣어 주세요.', { fatal: true });
  const ctrl = new AbortController();
  const onAbort = () => ctrl.abort();
  if (signal) { if (signal.aborted) throw new AppError('중단했어요.', { aborted: true }); signal.addEventListener('abort', onAbort); }
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, timeout);
  try {
    let res;
    try {
      res = await fetch(API + path, { ...init, headers: { ...(init.headers || {}), Authorization: 'Bearer ' + key }, signal: ctrl.signal });
    } catch (e) {
      if (signal && signal.aborted) throw new AppError('중단했어요.', { aborted: true });
      if (timedOut) throw new AppError('응답이 너무 오래 걸려요. 인터넷 연결을 확인하세요.', { retry: true });
      throw new AppError('인터넷에 연결되지 않았어요.\n→ 와이파이/데이터를 확인하고 다시 시도하세요.', { retry: true });
    }
    if (!res.ok) { let body = null; try { body = await res.json(); } catch {} throw apiError(res.status, body); }
    try { return await res.json(); }
    catch { throw new AppError('OpenAI 응답을 읽지 못했어요.', { retry: true }); }
  } finally { clearTimeout(timer); if (signal) signal.removeEventListener('abort', onAbort); }
}
const postJSON = (path, body, opt) => request(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, { timeout: 600000, ...opt });

async function transcribe(blob, name, prompt, signal) {
  const fd = new FormData();
  fd.append('file', blob, name);
  fd.append('model', cfg.tmodel);
  fd.append('language', 'ko');
  fd.append('response_format', 'json');
  if (prompt) fd.append('prompt', prompt);
  const j = await request('/v1/audio/transcriptions', { method: 'POST', body: fd }, { signal });
  if (typeof j.text !== 'string') throw new AppError('받아쓰기 결과가 비어 있어요.', { retry: true });
  return j.text.trim();
}

// responses 응답: output 배열 안의 type "output_text" 조각을 모은다
function collectOutputText(j) {
  const parts = [];
  const walk = n => {
    if (!n) return;
    if (Array.isArray(n)) return n.forEach(walk);
    if (n.type === 'output_text' && typeof n.text === 'string') parts.push(n.text);
    else if (Array.isArray(n.content)) walk(n.content);
  };
  walk(j.output);
  return parts.join('').trim();
}
let llmEndpoint = 'responses';
async function llm(system, user, signal) {
  const model = cfg.model;
  if (llmEndpoint === 'responses') {
    try {
      const t = collectOutputText(await postJSON('/v1/responses', { model, instructions: system, input: user }, { signal }));
      if (t) return t;
    } catch (e) {
      // 키/잔액/중단/네트워크 문제는 다른 주소로 재시도해도 소용없다
      if (e.aborted || (e.fatal && e.status !== 404) || e.retry || !e.status) throw e;
    }
    // responses 가 안 되면 chat/completions 로 재시도
    const j = await postJSON('/v1/chat/completions', { model, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }, { signal });
    const t = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
    if (!t) throw new AppError('정리 결과가 비어 있어요.', { retry: true });
    llmEndpoint = 'chat';
    return t;
  }
  const j = await postJSON('/v1/chat/completions', { model, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }, { signal });
  const t = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
  if (!t) throw new AppError('정리 결과가 비어 있어요.', { retry: true });
  return t;
}
async function withRetry(fn, signal, tries = 3) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (!e.retry || i >= tries - 1) throw e;
      await sleep(2000 * (i + 1));
      if (signal && signal.aborted) throw new AppError('중단했어요.', { aborted: true });
    }
  }
}

/* ================= 정리 프롬프트 ================= */
const COMMON = '규칙: 녹음에 없는 내용은 절대 지어내지 마세요. 언급이 없으면 "언급 없음"이라고 쓰세요. 한국어로, 짧은 문장, 요점 위주로 쓰세요. 마크다운 기호(#, **, - 등)는 쓰지 말고 번호와 줄바꿈만 쓰세요. 받아쓰기에 오타가 있어 보여도 맥락상 확실한 고유명사(BNI, 원투원, 리퍼럴 등)만 바로잡으세요.';
const PROMPTS = {
  lecture: `당신은 강의 녹음 받아쓰기 원문을 정리하는 비서입니다.\n${COMMON}\n\n아래 형식 그대로 출력하세요.\n1. 한 줄 요약\n2. 핵심 3가지 (각 2~3줄)\n3. 주요 개념과 설명\n4. 강사가 강조한 말이나 사례\n5. 내가 해볼 것 / 더 알아볼 것`,
  one21: `당신은 BNI 원투원(121) 미팅 녹음 받아쓰기 원문을 기록으로 정리하는 비서입니다. "나"는 녹음한 사람이고 "상대"는 미팅 상대입니다.\n${COMMON}\n\n아래 형식 그대로 출력하세요.\n1. 상대 이름, 회사, 업종 (언급된 것만)\n2. 상대의 사업 한 줄 소개와 차별점\n3. 이상적인 고객 (누구를 소개해 주면 좋은지)\n4. 상대가 원하는 소개 대상 / 연결해 주면 좋은 사람\n5. 나와의 공통점, 협업 가능성\n6. 대화 중 나온 개인적인 이야기 (관계에 도움이 되는 것만)\n7. 다음 할 일 (누가, 무엇을, 언제)`,
  polish: '다음 받아쓰기 글을 읽기 좋게 다듬으세요. 하는 일은 딱 두 가지입니다. (1) 의미 단위로 문단을 나누고 문단 사이에 빈 줄을 넣기. (2) "어", "음", "그", "뭐" 같은 군말과 같은 말 더듬기만 지우기. 단어를 바꾸거나 문장을 고치거나 요약하거나 내용을 덧붙이지 마세요. 말투와 순서도 그대로 두세요. 다듬은 글만 출력하고 설명은 쓰지 마세요.'
};
function splitText(text, max) {
  const out = []; let s = text.trim();
  while (s.length > max) {
    let cut = s.lastIndexOf('. ', max); if (cut < max * .5) cut = s.lastIndexOf('? ', max);
    if (cut < max * .5) cut = s.lastIndexOf(' ', max);
    if (cut < max * .5) cut = max; else cut += 1;
    out.push(s.slice(0, cut).trim()); s = s.slice(cut).trim();
  }
  if (s) out.push(s);
  return out;
}
async function makeNote(mode, text, onStep, signal) {
  if (mode === 'polish') {
    const parts = splitText(text, 5000), done = [];
    for (let i = 0; i < parts.length; i++) {
      onStep(`다듬는 중 ${i + 1}/${parts.length}`, i / parts.length);
      done.push(await withRetry(() => llm(PROMPTS.polish, parts[i], signal), signal));
    }
    return done.join('\n\n');
  }
  onStep('정리하는 중…', .5);
  return withRetry(() => llm(PROMPTS[mode], '다음은 녹음 받아쓰기 원문입니다.\n\n' + text, signal), signal);
}

/* ================= IndexedDB (최근 20개) ================= */
let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('talknote', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('results', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => {
  const t = d.transaction('results', mode), s = t.objectStore('results'); let out;
  Promise.resolve(fn(s)).then(v => out = v);
  t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const H = {
  all: () => tx('readonly', s => req(s.getAll())).then(a => a.sort((x, y) => y.createdAt - x.createdAt)),
  async put(rec) {
    await tx('readwrite', s => req(s.put(rec)));
    const all = await H.all();
    for (const old of all.slice(KEEP)) await tx('readwrite', s => req(s.delete(old.id)));
  },
  del: id => tx('readwrite', s => req(s.delete(id))),
  clear: () => tx('readwrite', s => req(s.clear()))
};

/* ================= ffmpeg.wasm (큰 파일일 때만 로드) ================= */
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => rej(new AppError('분할 도구를 내려받지 못했어요.\n→ 인터넷 연결을 확인하고 다시 시도하세요.', { retry: true })); document.head.appendChild(s); });
}
const extOf = f => { const m = /\.([a-z0-9]{2,4})$/i.exec(f.name); return m ? m[1].toLowerCase() : 'm4a'; };
const isWav = f => extOf(f) === 'wav' || /wav/.test(f.type);
function plan(file, duration) {
  const wav = isWav(file);
  const bps = wav ? 32000 : file.size / duration; // wav 는 16kHz 모노 16bit 로 바꿔 자름
  const sec = Math.max(10, Math.min(CHUNK_MAX_SEC, Math.floor(CHUNK_TARGET / bps)));
  return { wav, sec, count: Math.ceil(duration / sec) };
}
async function splitFile(file, sec, wav, onStatus) {
  if (!window.FFmpeg) { onStatus('분할 도구 불러오는 중… (처음 한 번만, 약 25MB)'); await loadScript(FFMPEG_JS); }
  const ff = window.FFmpeg.createFFmpeg({ log: false, corePath: FFMPEG_CORE, mainName: 'main' });
  try {
    onStatus('분할 도구 불러오는 중… (처음 한 번만, 약 25MB)');
    try { await ff.load(); } catch { throw new AppError('분할 도구를 시작하지 못했어요.\n→ 인터넷 연결을 확인하고, 계속 안 되면 Chrome을 최신으로 업데이트하세요.', { retry: true }); }
    const ext = wav ? 'wav' : extOf(file), inName = 'in.' + ext;
    onStatus('파일 읽는 중…');
    let data;
    try { data = new Uint8Array(await file.arrayBuffer()); }
    catch { throw new AppError('파일을 메모리로 읽지 못했어요. 파일이 너무 크거나 폰 메모리가 부족해요.\n→ PC에서 사용하거나 파일을 더 짧게 잘라 보세요.'); }
    ff.FS('writeFile', inName, data, { canOwn: true }); data = null;
    onStatus('파일 나누는 중… (몇 분 걸릴 수 있어요)');
    const args = ['-i', inName, '-f', 'segment', '-segment_time', String(sec), '-reset_timestamps', '1'];
    if (wav) args.push('-ac', '1', '-ar', '16000'); else args.push('-vn', '-c', 'copy');
    args.push('out%03d.' + ext);
    try { await ff.run(...args); }
    catch { throw new AppError('파일을 나누는 중 문제가 생겼어요. 이 파일은 폰 메모리로 처리하기 어려울 수 있어요.\n→ PC에서 열거나, 더 짧게 잘라서 올려 보세요.'); }
    try { ff.FS('unlink', inName); } catch {}
    const names = ff.FS('readdir', '/').filter(n => /^out\d+\./.test(n)).sort();
    if (!names.length) throw new AppError('파일을 나누지 못했어요. 지원하지 않는 형식일 수 있어요.');
    const mime = wav ? 'audio/wav' : ext === 'mp3' ? 'audio/mpeg' : ext === 'webm' ? 'video/webm' : ext === 'mp4' ? 'video/mp4' : 'audio/mp4';
    const out = [];
    for (const n of names) {
      const bytes = ff.FS('readFile', n); ff.FS('unlink', n);
      out.push({ blob: new Blob([bytes], { type: mime }), name: n });
    }
    return out;
  } finally { try { ff.exit(); } catch {} }
}

/* ================= 길이 읽기 ================= */
function readDuration(file) {
  return new Promise(res => {
    const el = document.createElement(/video|mp4|webm/.test(file.type + extOf(file)) ? 'video' : 'audio');
    const url = URL.createObjectURL(file);
    const done = v => { clearTimeout(t); URL.revokeObjectURL(url); el.removeAttribute('src'); res(v); };
    const t = setTimeout(() => done(0), 15000);
    el.preload = 'metadata';
    el.onloadedmetadata = () => done(isFinite(el.duration) ? el.duration : 0);
    el.onerror = () => done(0);
    el.src = url;
  });
}

let job = null;      // 진행 중 작업

function setProgress(text, frac) {
  $('#status').textContent = text;
  if (typeof frac === 'number') $('#barfill').style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
}
function showError(msg) { $('#proberr').innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : ''; }
async function keepAwake(on) {
  try {
    if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
const warnLeave = e => { e.preventDefault(); e.returnValue = ''; };

$('#start').onclick = async () => {
  if (!picked || job) return;
  const { file, duration } = picked;
  job = { file, duration, mode: modeVal(), polish: modeVal() === 'raw' && $('#polish').checked,
          chunks: [], ctrl: new AbortController(), rec: null };
  showError(''); $('#result').innerHTML = ''; $('#fails').innerHTML = '';
  $('#c-prog').hidden = false; $('#c-file').hidden = $('#c-mode').hidden = true;
  setProgress('준비 중…', 0); refreshHome();
  window.addEventListener('beforeunload', warnLeave); keepAwake(true);
  try {
    // 1) 조각 만들기
    if (!needSplit(file, duration)) {
      job.chunks = [{ blob: file, name: file.name, text: '', status: 'wait' }];
    } else {
      const p = plan(file, duration);
      const parts = await splitFile(file, p.sec, p.wav, t => setProgress(t, 0));
      if (job.ctrl.signal.aborted) throw new AppError('중단했어요.', { aborted: true });
      job.chunks = parts.map(c => ({ blob: c.blob, name: c.name, text: '', status: c.blob.size < 3000 ? 'skip' : 'wait' }));
    }
    // 2) 받아쓰기
    await runChunks();
  } catch (e) { endJob(e); }
};

async function transcribeChunk(i) {
  const c = job.chunks[i], total = job.chunks.length, sig = job.ctrl.signal;
  const prev = job.chunks.slice(0, i).reverse().find(x => x.status === 'done' && x.text);
  const prompt = [cfg.vocab.trim(), prev ? prev.text.slice(-200) : ''].filter(Boolean).join('\n');
  c.status = 'run';
  const n = job.chunks.filter(x => x.status === 'done' || x.status === 'skip').length;
  setProgress(`${i + 1}/${total} 조각 받아쓰는 중`, n / total);
  try {
    c.text = await withRetry(() => transcribe(c.blob, c.name, prompt, sig), sig, 3); // 첫 시도 + 재시도 2번
    c.status = 'done'; c.err = '';
  } catch (e) {
    if (e.aborted || e.fatal) throw e;
    c.status = 'fail'; c.err = e.message;
  }
}
async function runChunks() {
  for (let i = 0; i < job.chunks.length; i++)
    if (job.chunks[i].status === 'wait') await transcribeChunk(i);
  renderFails();
  if (!job.chunks.some(c => c.status === 'fail')) await finishJob();
  else setProgress('일부 조각이 실패했어요. 아래에서 다시 시도하세요.', 1);
}
function renderFails() {
  const box = $('#fails'); box.innerHTML = '';
  job.chunks.forEach((c, i) => {
    if (c.status !== 'fail') return;
    const d = document.createElement('div'); d.className = 'chunkfail';
    d.innerHTML = `<span>${i + 1}/${job.chunks.length} 조각 실패<div class="muted">${esc(c.err)}</div></span>`;
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = '다시 시도';
    b.onclick = async () => {
      $$('.chunkfail .btn').forEach(x => x.disabled = true);
      try { c.status = 'wait'; await transcribeChunk(i); renderFails();
        if (job.chunks.some(x => x.status === 'wait')) await runChunks();
        else if (!job.chunks.some(x => x.status === 'fail')) await finishJob();
        else setProgress('일부 조각이 실패했어요. 아래에서 다시 시도하세요.', 1);
      } catch (e) { endJob(e); }
    };
    d.appendChild(b); box.appendChild(d);
  });
}
async function finishJob() {
  const raw = job.chunks.filter(c => c.status === 'done').map(c => c.text).join(' ').trim();
  if (!raw) throw new AppError('받아쓴 글이 비어 있어요. 녹음에 말소리가 없는 것 같아요.');
  const rec = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), createdAt: Date.now(),
    fileName: job.file.name, mode: job.mode, duration: job.duration, raw, note: '', noteKind: '' };
  job.rec = rec;
  try { await H.put(rec); } catch { toast('기록 저장에 실패했어요 (결과는 화면에서 복사하세요)'); } // 원문부터 저장 → 정리 실패해도 안 잃음
  let noteErr = '';
  const kind = job.mode !== 'raw' ? job.mode : job.polish ? 'polish' : '';
  if (kind) {
    try {
      rec.note = await makeNote(kind, raw, (t, f) => setProgress(t, f), job.ctrl.signal);
      rec.noteKind = kind;
      try { await H.put(rec); } catch {}
    } catch (e) { if (e.aborted) throw e; noteErr = '받아쓰기는 끝났지만 정리에 실패했어요.\n' + e.message + '\n→ 아래 [정리 만들기]로 다시 시도할 수 있어요. 원문은 기록에 저장돼 있어요.'; }
  }
  endJob(null, rec, noteErr);
}
function endJob(err, rec, noteErr) {
  window.removeEventListener('beforeunload', warnLeave); keepAwake(false);
  const finished = !!rec;
  job = null;
  $('#c-prog').hidden = true; $('#c-file').hidden = $('#c-mode').hidden = false;
  if (finished) { picked = null; $('#fileinfo').hidden = true; }
  showError(err ? err.message : '');
  refreshHome();
  if (finished) { showResult(rec, noteErr); window.scrollTo(0, document.body.scrollHeight); }
}

async function renderHist() {
  const box = $('#histlist');
  let all;
  try { all = await H.all(); } catch { box.textContent = '이 브라우저에서는 기록 저장소를 쓸 수 없어요.'; return; }
  if (!all.length) { box.textContent = '아직 기록이 없어요.'; return; }
  box.innerHTML = '';
  for (const r of all) {
    const d = document.createElement('div'); d.className = 'hist';
    d.innerHTML = `<div class="t"><b>${esc(r.fileName)}</b><div class="muted">${fmtDate(r.createdAt)} · ${MODE_LABEL[r.mode]} · ${fmtDur(r.duration)}</div></div>`;
    const o = document.createElement('button'); o.className = 'btn'; o.textContent = '열기';
    o.onclick = () => { show('home'); showResult(r); $('#result').scrollIntoView(); };
    const x = document.createElement('button'); x.className = 'btn danger'; x.textContent = '삭제';
    x.onclick = async () => { if (confirm('이 기록을 삭제할까요?')) { await H.del(r.id); renderHist(); } };
    d.append(o, x); box.appendChild(d);
  }
}

/* ================= 설정 ================= */
function renderSettings() {
  $('#keystate').innerHTML = cfg.key ? `저장됨: <b>${esc(maskKey(cfg.key))}</b>` : '아직 저장된 키가 없어요.';
  $('#keyin').value = '';
  $('#vocab').value = cfg.vocab; $('#model').value = cfg.model; $('#tmodel').value = cfg.tmodel; $('#rate').value = cfg.rate;
}
$('#keysave').onclick = () => {
  const k = $('#keyin').value.replace(/\s+/g, '');
  if (!/^sk-[\w-]{20,}$/.test(k)) return toast('키 모양이 이상해요 (sk-로 시작)');
  store.set('key', k); renderSettings(); toast('키를 저장했어요');
};
$('#keydel').onclick = () => { if (confirm('저장된 키를 삭제할까요?')) { store.del('key'); renderSettings(); toast('키를 삭제했어요'); } };
for (const id of ['vocab', 'model', 'tmodel', 'rate']) $('#' + id).onchange = e => { store.set(id, e.target.value); llmEndpoint = 'responses'; toast('저장했어요'); };
$('#clearhist').onclick = async () => {
  if (!confirm('저장된 기록을 모두 삭제할까요? 되돌릴 수 없어요.')) return;
  try { await H.clear(); toast('기록을 모두 지웠어요'); } catch { toast('삭제에 실패했어요'); }
};
$('#test').onclick = async () => {
  const out = $('#testout'), btn = $('#test'); btn.disabled = true;
  out.innerHTML = '<div class="info">확인 중…</div>';
  const lines = [];
  const line = (ok, t) => lines.push(`<div class="${ok ? 'ok' : ''}" style="${ok ? '' : 'color:var(--bad);font-weight:700;white-space:pre-wrap'}">${ok ? '✅' : '❌'} ${esc(t)}</div>`);
  const paint = () => out.innerHTML = `<div class="info">${lines.join('')}</div>`;
  try {
    await request('/v1/models/' + encodeURIComponent(cfg.tmodel), { method: 'GET' }, { timeout: 30000 });
    line(true, `키 OK · 받아쓰기 모델 "${cfg.tmodel}" OK`);
  } catch (e) { line(false, `키/받아쓰기 모델: ${e.message}`); }
  try {
    llmEndpoint = 'responses';
    const t = await llm('한 단어로만 답하세요.', '"확인"이라고만 답하세요.', null);
    line(true, `정리 모델 "${cfg.model}" OK (${llmEndpoint === 'chat' ? 'chat/completions' : 'responses'}) → ${t.slice(0, 20)}`);
  } catch (e) { line(false, `정리 모델: ${e.message}`); }
  paint(); btn.disabled = false;
};

/* ================= 시작 ================= */
refreshHome();
if (!cfg.key) show('set');
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href))
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
